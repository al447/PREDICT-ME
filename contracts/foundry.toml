[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
optimizer = true
optimizer_runs = 200
remappings = [
    # OpenZeppelin v5 (our contracts + UMA adapter)
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "openzeppelin/=lib/openzeppelin-contracts/contracts/",
    # NOTE: openzeppelin-contracts/ is intentionally NOT remapped globally because
    # ctf-exchange imports openzeppelin-contracts/ and needs OZ v4.7 (draft-EIP712).
    # ctf-exchange-specific OZ v4.7 remapping comes from its own lib subdir.

    # Foundry std
    "forge-std/=lib/forge-std/src/",
    "ds-test/=lib/forge-std/lib/ds-test/src/",

    # CTF Exchange (Polymarket) — src paths
    "ctf-exchange/=lib/ctf-exchange/src/",
    "exchange/=lib/ctf-exchange/src/exchange/",
    "common/=lib/ctf-exchange/src/common/",
    "creator/=lib/ctf-exchange/src/creator/",
    "dev/=lib/ctf-exchange/src/dev/",
    # CTF Exchange nested libs
    "solmate/=lib/ctf-exchange/lib/solmate/src/",
    "solady/=lib/ctf-exchange/lib/solady/src/",
    # OZ v4.7 for ctf-exchange (has draft-EIP712.sol)
    "openzeppelin-contracts/=lib/ctf-exchange/lib/openzeppelin-contracts/contracts/",

    # UMA CTF Adapter (Polymarket)
    "uma-ctf-adapter/=lib/uma-ctf-adapter/src/",
    # Context-scoped: src/ inside uma-ctf-adapter resolves to its own src/
    "lib/uma-ctf-adapter/:src/=lib/uma-ctf-adapter/src/",
    "lib/uma-ctf-adapter/:lib/openzeppelin-contracts/=lib/uma-ctf-adapter/lib/openzeppelin-contracts/",
    "lib/uma-ctf-adapter/:lib/solmate/=lib/uma-ctf-adapter/lib/solmate/",

    # NegRisk CTF Adapter (Polymarket)
    "neg-risk-ctf-adapter/=lib/neg-risk-ctf-adapter/src/",
    "exchange-fee-module/=lib/neg-risk-ctf-adapter/lib/exchange-fee-module/src/",
    "forge-gas-snapshot/=lib/neg-risk-ctf-adapter/lib/forge-gas-snapshot/src/",
    # Context-scoped: src/ inside neg-risk-ctf-adapter resolves to its own src/
    "lib/neg-risk-ctf-adapter/:src/=lib/neg-risk-ctf-adapter/src/",
    "lib/neg-risk-ctf-adapter/:lib/solmate/=lib/neg-risk-ctf-adapter/lib/solmate/",
    "lib/neg-risk-ctf-adapter/:lib/openzeppelin-contracts/=lib/neg-risk-ctf-adapter/lib/ctf-exchange/lib/openzeppelin-contracts/",

]
auto_detect_solc = true

[profile.default.fuzz]
runs = 256

[profile.script]
src = "contracts"
optimizer_runs = 200
via_ir = true

# Named RPC endpoints: forge script --rpc-url amoy|polygon
[rpc_endpoints]
amoy    = "${POLYGON_AMOY_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"

# Contract verification (forge script --verify). Single Polygonscan key works
# for both chains via the chain-specific verifier URLs.
[etherscan]
amoy    = { key = "${POLYGONSCAN_API_KEY}", chain = 80002, url = "https://api-amoy.polygonscan.com/api" }
polygon = { key = "${POLYGONSCAN_API_KEY}", chain = 137 }
