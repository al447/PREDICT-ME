specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  # MarketFactory - MarketCreated events
  # Polygon MAINNET deployment 2026-06-17 (chainId 137), block 88660117
  - kind: ethereum
    name: MarketFactory
    network: matic
    source:
      address: "0x0e9Be76713060ae72bF4a431a79DE4e4342703Dd"
      abi: MarketFactory
      startBlock: 88660117
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Market
        - MarketCreatedEvent
      abis:
        - name: MarketFactory
          file: ./abis/MarketFactory.json
      eventHandlers:
        - event: MarketCreated(indexed bytes32,indexed bytes32,uint256,uint256,address,bool,bytes)
          handler: handleMarketCreated
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: ./src/marketFactory.ts

  # CTFExchange - OrdersMatched events
  - kind: ethereum
    name: CTFExchange
    network: matic
    source:
      address: "0xB2FB436cC2E6F5c8F2cb9a876FF4AF0CfDF2D8D8"
      abi: CTFExchange
      startBlock: 88660117
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Trade
        - OrderMatch
      abis:
        - name: CTFExchange
          file: ./abis/CTFExchange.json
      eventHandlers:
        - event: OrdersMatched(indexed bytes32,indexed address,uint256,uint256,uint256,uint256)
          handler: handleOrdersMatched
      file: ./src/ctfExchange.ts

  # ConditionalTokens - Position lifecycle events (split, merge, redeem)
  - kind: ethereum
    name: ConditionalTokens
    network: matic
    source:
      address: "0x4518a86c85F3D0aE6ac100B9384011bba63a9b1c"
      abi: ConditionalTokens
      startBlock: 88660117
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Condition
        - Position
        - PositionBalance
        - Payout
      abis:
        - name: ConditionalTokens
          file: ./abis/ConditionalTokens.json
      eventHandlers:
        - event: ConditionPreparation(indexed bytes32,indexed address,indexed bytes32,uint256)
          handler: handleConditionPreparation
        - event: PositionSplit(indexed address,address,indexed bytes32,indexed bytes32,uint256[],uint256)
          handler: handlePositionSplit
        - event: PositionsMerge(indexed address,address,indexed bytes32,indexed bytes32,uint256[],uint256)
          handler: handlePositionsMerge
        - event: PayoutRedemption(indexed address,indexed address,indexed bytes32,bytes32,uint256[],uint256)
          handler: handlePayoutRedemption
        - event: ConditionResolution(indexed bytes32,indexed address,indexed bytes32,uint256,uint256[])
          handler: handleConditionResolution
      file: ./src/conditionalTokens.ts

  # UmaCtfAdapter - Resolution events
  - kind: ethereum
    name: UmaCtfAdapter
    network: matic
    source:
      address: "0x78E4B65e23cAD525851F32A1FF19320dE1Df73f7"
      abi: UmaCtfAdapter
      startBlock: 88660117
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Question
        - Resolution
      abis:
        - name: UmaCtfAdapter
          file: ./abis/UmaCtfAdapter.json
        - name: OptimisticOracleV2
          file: ./abis/OptimisticOracleV2.json
      eventHandlers:
        - event: QuestionInitialized(indexed bytes32,indexed uint256,indexed address,bytes,address,uint256,uint256)
          handler: handleQuestionInitialized
        - event: QuestionResolved(indexed bytes32,indexed int256,uint256[])
          handler: handleQuestionResolved
      file: ./src/umaCtfAdapter.ts
